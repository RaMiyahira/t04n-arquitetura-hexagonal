spring.datasource.url=jdbc:h2:mem:arq_software
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=create-drop

spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:${ACCESS_KEY:}}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:${SECRET_KEY:}}

aws.sqs.queue.saida-estoque=SQS-SAIDA-ESTOQUE.fifo
aws.sqs.queue.saida-estoque.enabled=false
aws.sqs.queue.entrada-estoque=SQS-ENTRADA-ESTOQUE.fifo
aws.sqs.queue.entrada-estoque.enabled=false
queue.order-events=${AWS_SQS_ORDER_EVENTS_QUEUE:T04N_RAFAEL_ALVES_MIYAHIRA.fifo}
queue.order-events.enabled=true
